function formatCurrency(amount, currency) {
  if (currency === "COP") return "COP " + amount.toLocaleString("es-CO");
  return "US$ " + amount.toLocaleString("en-US");
}
const MONTHS_ES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return `${d.getDate()} ${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}`;
}
const TODAY = new Date("2026-08-01T00:00:00");
function daysUntil(iso) {
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - TODAY) / (1000 * 60 * 60 * 24));
}

function Badge({ label, tone = "info", size = "md" }) {
  const t = useT();
  const toneMap = {

    warn: [t.c.warn, t.c.warnSoft], info: [t.c.info, t.c.infoSoft],
    brand: [t.c.brand, t.c.brandSoft], gold: [t.c.gold, t.c.goldSoft],
    neutral: [t.c.textMuted, t.c.surfaceAlt],
  };
  const [fg, bg] = toneMap[tone] || toneMap.info;
  return (
    <span style={{ color: fg, background: bg }} className={`inline-flex items-center gap-1 rounded-full font-semibold whitespace-nowrap ${size === "sm" ? "text-[11px] px-2 py-0.5" : "text-xs px-2.5 py-1"}`}>

function StatusBadge({ status, size = "md" }) { return <Badge label={status} tone={STATUS_STYLE[status] || "neutral"} size={size} />; }

function Card({ children, className = "", style = {}, onClick }) {

function ProgressRing({ value, size = 56, stroke = 6, label, tone = "brand" }) {
  const t = useT();
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, value));
  const offset = c * (1 - clamped);
  const color = t.c[tone] || t.c.brand;
  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke={t.c.borderStrong} strokeWidth={stroke} fill="none" opacity={0.5} />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.6s ease" }} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center flex-col">
        <span style={{ fontFamily: "var(--font-mono)", color: t.c.text }} className="font-semibold">
          {label !== undefined ? label : `${pct(clamped)}%`}
        </span>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */

function SimpleBarChart({ data, valueKey, labelKey, color, textColor, gridColor, height = 220, formatValue }) {
  const [hover, setHover] = useState(null);
  const W = 640, H = height, padL = 6, padR = 6, padT = 12, padB = 28;
  const max = Math.max(1, ...data.map((d) => d[valueKey]));
  const niceMax = max * 1.15;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const gap = 14;
  const bw = (plotW - gap * (data.length - 1)) / data.length;
  const gridLines = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div style={{ position: "relative", width: "100%" }}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none" role="img" aria-label="Monto solicitado por proyecto">
        {gridLines.map((g, i) => {
          const y = padT + plotH * (1 - g);
          return <line key={i} x1={padL} x2={W - padR} y1={y} y2={y} stroke={gridColor} strokeWidth="1" />;
        })}
        {data.map((d, i) => {
          const x = padL + i * (bw + gap);
          const h = Math.max(2, (d[valueKey] / niceMax) * plotH);
          const y = padT + plotH - h;
          const r = Math.min(4, bw / 2, h);
          const path = `M${x},${padT + plotH} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + bw - r},${y} Q${x + bw},${y} ${x + bw},${y + r} L${x + bw},${padT + plotH} Z`;
          const isHover = hover === i;
          return (
            <g key={i}>
              <path d={path} fill={color} opacity={isHover ? 1 : 0.85}
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer", transition: "opacity .15s" }} />
              <rect x={x} y={padT} width={bw} height={plotH} fill="transparent"
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }} />
              <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="10.5" fill={textColor}>{d[labelKey]}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <div style={{
          position: "absolute", left: `${((padL + hover * (bw + gap) + bw / 2) / W) * 100}%`,
          top: 0, transform: "translate(-50%, -100%)", background: "var(--surface)", border: "1px solid var(--border)",
          borderRadius: 8, padding: "6px 10px", fontSize: 12, fontFamily: "var(--font-mono)", color: "var(--text)",
          boxShadow: "0 4px 16px rgba(0,0,0,0.12)", pointerEvents: "none", whiteSpace: "nowrap", zIndex: 5,
        }}>
          {formatValue ? formatValue(data[hover][valueKey]) : data[hover][valueKey]}
        </div>
      )}
    </div>
  );
}

function useDashboardStats() {
  return useMemo(() => {
    const activas = CONVOCATORIAS.filter((c) => ["En revisión", "Enviada", "En evaluación", "Solicitaron ajustes", "Redactando propuesta", "Preparando documentos"].includes(c.estado)).length;
    const aprobadas = CONVOCATORIAS.filter((c) => c.estado === "Aprobada").length;
    const rechazadas = CONVOCATORIAS.filter((c) => c.estado === "Rechazada").length;
    const preparacion = CONVOCATORIAS.filter((c) => ["Investigación", "Preparando documentos"].includes(c.estado)).length;
    const enviadas = CONVOCATORIAS.filter((c) => ["Enviada", "En evaluación"].includes(c.estado)).length;
    const montoSolicitadoUSD = CONVOCATORIAS.reduce((sum, c) => sum + (c.moneda === "USD" ? c.montoSolicitado : c.montoSolicitado / 4100), 0);
    const documentosPendientes = CONVOCATORIAS.flatMap((c) => c.documentos).filter((d) => d.estado !== "Aprobado").length;
    const tareasPendientes = CONVOCATORIAS.flatMap((c) => c.tareas).filter((t) => t.estado !== "Finalizada").length;
    return { activas, aprobadas, rechazadas, preparacion, enviadas, montoSolicitadoUSD, documentosPendientes, tareasPendientes };
  }, []);
}

function FilterGroup({ title, options, selected, toggle }) {
  const t = useT();
  return (
    <div className="mb-5">

      <div className="space-y-1.5">
        {options.map((o) => {
          const active = selected.includes(o);
          return (
            <button key={o} onClick={() => toggle(o)} className="w-full flex items-center gap-2 text-left group">
              <span style={{ borderColor: active ? t.c.brand : t.c.borderStrong, background: active ? t.c.brand : "transparent" }} className="h-4 w-4 rounded flex items-center justify-center flex-shrink-0 border transition">

              <span style={{ color: active ? t.c.text : t.c.textMuted }} className="text-[13px] group-hover:opacity-80 truncate">{o}</span>

    </div>
  );

function OpportunitiesView({ addedIds, onAdd }) {
  const t = useT();
  const [query, setQuery] = useState("");
  const [selPais, setSelPais] = useState([]);
  const [selArea, setSelArea] = useState([]);
  const [selCat, setSelCat] = useState([]);
  const toggle = (setter, arr, val) => setter(arr.includes(val) ? arr.filter((x) => x !== val) : [...arr, val]);
  const filtered = OPPORTUNITIES.filter((op) => {
    if (query && !op.nombre.toLowerCase().includes(query.toLowerCase())) return false;
    if (selPais.length && !selPais.includes(op.pais)) return false;
    if (selArea.length && !selArea.includes(op.area)) return false;
    if (selCat.length && !selCat.includes(op.categoria)) return false;
    return true;
  });
  return (
    <div>
      <SectionTitle eyebrow="Descubrimiento" title="Oportunidades de financiación" />
      <div style={{ background: t.c.surfaceAlt, border: `1px solid ${t.c.border}` }} className="flex items-center gap-2 rounded-xl px-4 py-3 mb-5">
        <Icon name="search" size={16} color={t.c.textFaint} />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar por nombre, entidad o palabra clave…" style={{ color: t.c.text }} className="bg-transparent outline-none text-sm w-full placeholder:opacity-60" id="opp-search" />
        <span style={{ color: t.c.textFaint }} className="text-xs flex-shrink-0">{filtered.length} resultados</span>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <Card className="p-5 lg:col-span-1 h-fit">
          <div className="flex items-center gap-2 mb-4">
            <Icon name="filter" size={15} color={t.c.brand} />
            <span style={{ color: t.c.text, fontFamily: "var(--font-display)" }} className="font-semibold text-sm">Filtros</span>
          </div>
          <FilterGroup title="País" options={FILTER_GROUPS.pais} selected={selPais} toggle={(v) => toggle(setSelPais, selPais, v)} />
          <FilterGroup title="Área temática" options={FILTER_GROUPS.area} selected={selArea} toggle={(v) => toggle(setSelArea, selArea, v)} />
          <FilterGroup title="Categoría" options={FILTER_GROUPS.categoria} selected={selCat} toggle={(v) => toggle(setSelCat, selCat, v)} />
        </Card>
        <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-5">
          {filtered.map((op) => <OpportunityCard key={op.id} op={op} added={addedIds.includes(op.id)} onAdd={onAdd} />)}
          {filtered.length === 0 && <div className="md:col-span-2"><EmptyState icon="search" title="Sin resultados" subtitle="Ajusta tus filtros o intenta con otra palabra clave." /></div>}
        </div>
      </div>
    </div>
  );
}

function evaluationFor(c) {
  const score = Math.round(c.progreso * 92 + (c.documentos.filter((d) => d.estado === "Aprobado").length * 1.5));
  const clamped = Math.min(98, Math.max(35, score));
  return {
    score: clamped,
    cumplimiento: Math.round((c.checklist.filter((i) => i.estado === "Completado").length / (c.checklist.length || 1)) * 100),
    faltantes: c.documentos.filter((d) => d.estado !== "Aprobado").map((d) => d.nombre),
    fortalezas: ["Equipo con experiencia previa en convocatorias similares", "Presupuesto coherente con el monto máximo financiable", "Evidencia de piloto o antecedentes verificables"],
    debilidades: ["Falta evidencia cuantitativa de impacto a 12 meses", "El cronograma tiene poco margen antes del cierre"],
    riesgos: [{ texto: "Cierre próximo con documentos aún en elaboración", nivel: "Alta" }, { texto: "Dependencia de un solo proveedor para equipos", nivel: "Media" }],
    recomendaciones: ["Adelantar la revisión jurídica al menos 10 días antes del cierre", "Incluir una carta de respaldo institucional adicional"],
    probabilidad: clamped >= 80 ? "Alta" : clamped >= 55 ? "Media" : "Baja",
  };
}

function CopilotView() {
  const t = useT();
  const [step, setStep] = useState(0);
  const [messages, setMessages] = useState([{ role: "ai", text: "Hola Eric — soy tu copiloto de formulación. Vamos a construir el proyecto \"Lentes Inteligentes de Bajo Costo\" juntos, paso a paso. " + COPILOT_SCRIPT[0].pregunta }]);
  const [sections, setSections] = useState([]);
  const [input, setInput] = useState("");
  const finished = step >= COPILOT_SCRIPT.length;

  const advance = () => {
    if (finished) return;
    const current = COPILOT_SCRIPT[step];
    const userText = input.trim() || current.respuesta;
    const nextMsgs = [...messages, { role: "user", text: userText }];
    setSections((prev) => [...prev, current.seccion]);
    const nextStep = step + 1;
    if (nextStep < COPILOT_SCRIPT.length) nextMsgs.push({ role: "ai", text: "Perfecto, registrado. " + COPILOT_SCRIPT[nextStep].pregunta });
    else nextMsgs.push({ role: "ai", text: "Con esto tengo lo esencial. Generé el resumen ejecutivo y las secciones principales del proyecto — puedes editarlas a la derecha, o pedirme que continúe con la matriz de riesgos y los indicadores." });
    setMessages(nextMsgs); setStep(nextStep); setInput("");
  };

  return (
    <div>
      <SectionTitle eyebrow="Copiloto inteligente" title="Formulación guiada de proyecto" />
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
        <Card className="flex flex-col h-[600px]">
          <div style={{ borderBottom: `1px solid ${t.c.border}` }} className="px-5 py-4 flex items-center gap-2"><Icon name="bot" size={16} color={t.c.brand} /><span style={{ color: t.c.text, fontFamily: "var(--font-display)" }} className="font-semibold text-sm">Consultor experto en convocatorias</span></div>
          <div className="flex-1 overflow-y-auto p-5 space-y-4">

            {finished && <div className="flex flex-wrap gap-2 pl-11"><Badge label="Nota conceptual lista" tone="success" size="sm" /><Badge label="Objetivos listos" tone="success" size="sm" /><Badge label="Metodología lista" tone="success" size="sm" /><Badge label="Matriz de riesgos (pendiente)" tone="neutral" size="sm" /></div>}
          </div>
          <div style={{ borderTop: `1px solid ${t.c.border}` }} className="p-4">
            {!finished ? (
              <div className="flex items-center gap-2">
                <input id="copilot-input" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && advance()} placeholder={`Ej: ${COPILOT_SCRIPT[step].respuesta.slice(0, 46)}…`} style={{ background: t.c.surfaceAlt, border: `1px solid ${t.c.border}`, color: t.c.text }} className="flex-1 rounded-lg px-3.5 py-2.5 text-[13px] outline-none" />

        <Card className="p-5 h-[600px] overflow-y-auto">
          <div className="flex items-center gap-2 mb-4"><Icon name="fileText" size={16} color={t.c.brand} /><span style={{ color: t.c.text, fontFamily: "var(--font-display)" }} className="font-semibold text-sm">Documento generado en vivo</span></div>

const WEEKDAYS_ES = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
function buildMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = first.getDay();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

      <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">

          <div className="grid grid-cols-7 gap-1.5 mb-1.5">{WEEKDAYS_ES.map((w) => <div key={w} style={{ color: t.c.textFaint }} className="text-center text-[10.5px] font-semibold uppercase py-1">{w}</div>)}</div>

                </div>
              );
            })}
          </div>
        </Card>
        <div className="space-y-5">
          <Card className="p-5">
            <div style={{ color: t.c.text, fontFamily: "var(--font-display)" }} className="font-semibold text-sm mb-3">Recibir avisos</div>
            <div className="space-y-2.5">
              {Object.keys(reminders).map((r, i) => (
                <label key={r} className="flex items-center gap-2.5 cursor-pointer" htmlFor={`reminder-${i}`}>
                  <input id={`reminder-${i}`} type="checkbox" checked={reminders[r]} onChange={() => setReminders((prev) => ({ ...prev, [r]: !prev[r] }))} className="h-4 w-4" style={{ accentColor: t.c.brand }} />
                  <span style={{ color: t.c.text }} className="text-[13px]">{r}</span>
                </label>
              ))}
            </div>
          </Card>
          <Card className="p-5">
            <div style={{ color: t.c.textFaint }} className="text-[11px] uppercase font-semibold tracking-widest mb-3">Próximas integraciones</div>
            <div className="space-y-2">{["Microsoft Outlook Calendar", "Apple Calendar"].map((x) => <div key={x} className="flex items-center justify-between"><span style={{ color: t.c.textMuted }} className="text-[13px]">{x}</span><Badge label="Próximamente" tone="neutral" size="sm" /></div>)}</div>
          </Card>
        </div>
      </div>
    </div>
  );
}

const VIEW_META = {
  dashboard: { title: "Panel principal", subtitle: "Resumen general de tu actividad" },
  opportunities: { title: "Oportunidades", subtitle: "Explora convocatorias disponibles" },
  workspaces: { title: "Mis convocatorias", subtitle: "Espacios de trabajo activos" },
  copilot: { title: "Copiloto IA", subtitle: "Formulación asistida de proyectos" },
  agents: { title: "Biblioteca de agentes", subtitle: "Agentes especializados a tu disposición" },
  calendar: { title: "Calendario", subtitle: "Fechas y recordatorios" },
  notifications: { title: "Notificaciones", subtitle: "Actividad reciente de tus convocatorias" },
  users: { title: "Equipo y usuarios", subtitle: "Roles y permisos de la plataforma" },
  billing: { title: "Plan y facturación", subtitle: "Gestiona tu suscripción" },
};

function makeStubConvocatoria(op) {
  return {
    id: "new-" + op.id, proyecto: "Nuevo proyecto — " + op.nombre.split(" ").slice(0, 4).join(" "),
    convocatoria: op.nombre, entidad: op.entidad, pais: op.pais, enlace: op.enlace,
    descripcion: "Espacio de trabajo creado automáticamente al agregar esta oportunidad. Completa la descripción con el Copiloto IA.",
    apertura: op.apertura, cierre: op.cierre, resultados: op.cierre, montoSolicitado: 0, montoMax: op.montoMax, moneda: op.moneda,
    responsable: "Eric Fonseca", equipo: ["u1"], observaciones: "", estado: "Investigación", progreso: 0.04,
    checklist: [{ id: "n1", texto: "Leer términos de referencia completos", estado: "Pendiente" }],
    documentos: [],
    tareas: [{ id: "nt1", titulo: "Leer términos de referencia", estado: "Pendiente", prioridad: "Alta", responsable: "Eric Fonseca", fecha: op.cierre }],
    presupuesto: [],
    cronograma: [{ id: "nc1", actividad: "Diagnóstico inicial", fecha: op.apertura, entregable: "Notas de viabilidad", responsable: "Eric Fonseca", estado: "Pendiente" }],
    evidencias: [],
    historial: [{ id: "nh1", accion: "Convocatoria agregada al espacio de trabajo", autor: "Eric Fonseca", fecha: "2026-08-01 09:00" }],
  };
}

function NubeletechApp() {
  const [isDark, setIsDark] = useState(() => { try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } });
  const [view, setView] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [convocatorias, setConvocatorias] = useState(CONVOCATORIAS);
  const [addedIds, setAddedIds] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [notifications, setNotifications] = useState(NOTIFICATIONS_SEED);

  const colors = isDark ? palette.dark : palette.light;
  const themeValue = useMemo(() => ({ c: colors, isDark }), [isDark]);

  const handleAddOpportunity = (op) => {
    if (addedIds.includes(op.id)) return;
    setAddedIds((prev) => [...prev, op.id]);
    setConvocatorias((prev) => [makeStubConvocatoria(op), ...prev]);
  };
  const openWorkspace = (id) => { setSelectedId(id); setView("workspaces"); };
  const markRead = (id) => setNotifications((prev) => prev.map((n) => (id === "all" || n.id === id ? { ...n, leido: true } : n)));

  const unreadCount = notifications.filter((n) => !n.leido).length;
  const selected = convocatorias.find((c) => c.id === selectedId);
  const meta = VIEW_META[view] || {};

  useEffect(() => {
    document.documentElement.style.setProperty("--surface", colors.surface);
    document.documentElement.style.setProperty("--border", colors.border);
    document.documentElement.style.setProperty("--text", colors.text);
  }, [colors]);

  return (
    <ThemeCtx.Provider value={themeValue}>
      <div style={{ background: colors.bg }} className="w-full h-full flex overflow-hidden relative">
        {mobileOpen && <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setMobileOpen(false)} />}
        <Sidebar view={view} setView={setView} collapsed={collapsed} setCollapsed={setCollapsed} unreadCount={unreadCount} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
        <div className="flex-1 min-w-0 flex flex-col">
          <Topbar title={meta.title} subtitle={meta.subtitle} isDark={isDark} setIsDark={setIsDark} setView={setView} onMenu={() => setMobileOpen(true)} />
          <main className="flex-1 overflow-y-auto p-4 md:p-6">
            {view === "dashboard" && <DashboardView setView={setView} openWorkspace={openWorkspace} />}
            {view === "opportunities" && <OpportunitiesView addedIds={addedIds} onAdd={handleAddOpportunity} />}
            {view === "workspaces" && (selected ? <WorkspaceDetailView convocatoria={selected} onBack={() => setSelectedId(null)} /> : <WorkspaceListView convocatorias={convocatorias} onOpen={openWorkspace} setView={setView} />)}
            {view === "copilot" && <CopilotView />}
            {view === "agents" && <AgentsView />}
            {view === "calendar" && <CalendarView />}
            {view === "notifications" && <NotificationsView notifications={notifications} markRead={markRead} />}
            {view === "users" && <UsersView />}
            {view === "billing" && <BillingView />}
          </main>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
function start() { root.render(<NubeletechApp />); }
if (window.claude && window.claude.hot && window.claude.hot.ready) { window.claude.hot.ready(start); } else { start(); }
</script>
